[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-controller-worker"
version = "0.1.0"
description = "Temporal worker for factory event workflows"
requires-python = ">=3.12"
dependencies = [
  "temporalio==1.34.0",
  "pydantic-settings==2.16.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
