[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-worker"
version = "0.1.0"
description = "Temporal activity worker for an OpenCode execution demo"
requires-python = ">=3.12"
dependencies = ["temporalio==1.34.0", "pydantic-settings==2.16.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
