# Every step builds from the repository root, which is the Docker build context.
image: docker:27-cli

definitions:
  services:
    docker:
      memory: 4096
  steps:
    - step: &service-tests
        services: [docker]

pipelines:
  default:
    - parallel:
        - step:
            <<: *service-tests
            name: Test api
            script:
              - export SERVICE=api
              - docker build --target test -f src/$SERVICE/Dockerfile -t $SERVICE-test .
              - docker run --rm $SERVICE-test
        - step:
            <<: *service-tests
            name: Test controller
            script:
              - export SERVICE=controller
              - docker build --target test -f src/$SERVICE/Dockerfile -t $SERVICE-test .
              - docker run --rm $SERVICE-test
        - step:
            <<: *service-tests
            name: Test egress-proxy
            script:
              - export SERVICE=egress-proxy
              - docker build --target test -f src/$SERVICE/Dockerfile -t $SERVICE-test .
              - docker run --rm $SERVICE-test
        - step:
            <<: *service-tests
            name: Test sandbox-launcher
            script:
              - export SERVICE=sandbox-launcher
              - docker build --target test -f src/$SERVICE/Dockerfile -t $SERVICE-test .
              - docker run --rm $SERVICE-test
        - step:
            name: Check documentation
            image: python:3.12-slim
            script:
              - python3 tools/check-docs.py
        - step:
            name: Check vulnerable packages
            image: mcr.microsoft.com/dotnet/sdk:10.0
            script:
              - dotnet list dev-foundry.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
              - "! grep -q 'has the following vulnerable packages' vulnerable.txt"
    - step:
        name: Integration tests
        services: [docker]
        script:
          - apk add --no-cache docker-cli-compose openssl
          # Throwaway credentials for this run only.
          - cp deploy/.env.example deploy/.env
          - |
            for key in POSTGRES_PASSWORD TEMPORAL_DB_PASSWORD PGADMIN_DEFAULT_PASSWORD; do
              sed -i "s|^$key=.*|$key=$(openssl rand -hex 24)|" deploy/.env
            done
            sed -i "s|^FACTORY_HOSTS=.*|FACTORY_HOSTS=[{\"name\":\"forgejo\",\"url\":\"http://forgejo:3000\",\"webhook_secret\":\"$(openssl rand -hex 32)\"}]|" deploy/.env
          - cd deploy
          - docker compose up -d --build --wait api controller
          - docker compose --profile test run --build --rm --no-deps integration-tests
          - docker compose logs --no-color || true
