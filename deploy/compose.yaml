name: ai-sdlc-factory

# Networks limit what each service can reach:
#   data    PostgreSQL and its direct clients (only with compose.postgres.yaml)
#   control Temporal clients and the trusted controller services
#   hooks   a git host's webhook delivery to the api (a host that runs in Docker, such as ../forgejo, joins this network)
#   forge   the controller's way to such a host: its API and git access (ticket comments, branches, pull requests)
#   agents  the OpenCode login helper only: internet access for the browser login, no factory service
#   egress  the egress proxy's way to the internet; nothing else joins it
#   sandbox-model, sandbox-packages, sandbox-developer
#           one internal network (no route out, no external DNS) per egress profile for the disposable agent
#           containers the sandbox launcher starts. Only the egress proxy joins them, and it lets a sandbox
#           reach just the hosts its profile lists (src/egress-proxy/profiles.json)

# Helpers for the OpenCode login. They run from the Python sandbox image (which already has OpenCode),
# only when asked for (profile opencode-tools), as the factory user and with no capabilities.
x-opencode-tools: &opencode-tools
  image: ai-sdlc-factory/sandbox-python:local
  build:
    context: ../sandboxes
    dockerfile: python/Dockerfile
  profiles: ["opencode-tools"]
  networks: [agents]
  user: "${FACTORY_UID:-1000}:${FACTORY_GID:-1000}"
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 1g
  cpus: 1
  restart: "no"
  environment:
    # The login volume is mounted at /data/opencode, so OpenCode writes auth.json to its root,
    # which is where the sandboxes look for it.
    HOME: /tmp
    XDG_DATA_HOME: /data
    XDG_CACHE_HOME: /tmp/cache
    XDG_CONFIG_HOME: /tmp/config
  tmpfs:
    - /tmp:size=256m,mode=1777

x-hardened: &hardened
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 512m
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  # Temporal's own single-process server with its data in one SQLite file: nothing else to run, and no database passwords. Fine for one machine; for a
  # PostgreSQL-backed Temporal add compose.postgres.yaml (see README.md#temporal-database). The volume is mounted in the image user's home, which that user owns.
  temporal:
    image: temporalio/temporal:1.10.1  # bundles Temporal server 1.32.2 (compose.postgres.yaml runs 1.32.1)
    restart: unless-stopped
    # start-dev is the single-process server; --db-filename makes it keep its data in a file (without it the data is in memory and lost on restart).
    # --ip 0.0.0.0 lets other containers connect; --headless leaves out its built-in web UI, because temporal-ui below is the one used.
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--headless", "--db-filename", "/home/temporal/temporal.db"]
    # control: the factory services. agents: the OpenCode login helper's network, as before.
    networks: [control, agents]
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"   # localhost only: Temporal has no authentication
    volumes:
      - temporal-data:/home/temporal   # the SQLite file; back it up with the stack stopped (docs/operations.md#backups-and-data)
    # Ready when the gRPC port accepts connections; temporal-namespace then checks the cluster itself.
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One-shot setup: creates the namespace with its retention (see temporal/setup-namespace.sh). The api, controller and launcher wait for it.
  temporal-namespace:
    image: temporalio/admin-tools:1.32.1
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_RETENTION: ${TEMPORAL_RETENTION:-7d}
      # The SQLite server creates the "default" namespace itself (1 day retention), so the setup service sets the retention there too.
      TEMPORAL_UPDATE_RETENTION: "true"
    networks: [control]
    volumes:
      - ./temporal/setup-namespace.sh:/scripts/setup-namespace.sh:ro
    entrypoint: ["/bin/sh", "/scripts/setup-namespace.sh"]

  # The web UI: every workflow with its history. It waits for the namespace so it never shows an empty server.
  temporal-ui:
    image: temporalio/ui:2.58.1
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
    networks: [control]
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8080}:8080"

  api:
    <<: *hardened
    image: ai-sdlc-factory/api:local
    build:
      context: ..
      dockerfile: src/api/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-factory-events}
      # The git hosts the factory serves (see docs/configuration.md): each gets its own webhook route /webhooks/<name> and secret.
      FACTORY_HOSTS: ${FACTORY_HOSTS:?Set FACTORY_HOSTS in .env}
    networks: [control, hooks]
    ports:
      - "127.0.0.1:${CONTROLLER_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "dotnet", "AiSdlcFactory.Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  controller:
    <<: *hardened
    image: ai-sdlc-factory/controller:local
    build:
      context: ..
      dockerfile: src/controller/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-factory-events}
      # How a person opens the Temporal web UI; used for the link to a run's record in ticket comments.
      TEMPORAL_UI_URL: ${TEMPORAL_UI_URL:-http://localhost:${TEMPORAL_UI_PORT:-8080}}
      # The git hosts the factory serves, with the bot's token and login on each, and how each one's tickets pick a workflow (see docs/configuration.md).
      FACTORY_HOSTS: ${FACTORY_HOSTS:?Set FACTORY_HOSTS in .env}
      # How long what a git host said a person may do on a repository is kept, when a host has a rule of who may steer the factory (see docs/configuration.md). 0 asks every time.
      FACTORY_PERMISSION_CACHE_SECONDS: ${FACTORY_PERMISSION_CACHE_SECONDS:-300}
      # The name and e-mail address on the commits the factory makes (see docs/configuration.md).
      # The model every agent uses unless its role file names another; empty keeps the default of agents/opencode.json. The launcher gets the same value.
      FACTORY_MODEL: ${FACTORY_MODEL:-}
      FACTORY_GIT_AUTHOR_NAME: ${FACTORY_GIT_AUTHOR_NAME:-AI SDLC Factory}
      FACTORY_GIT_AUTHOR_EMAIL: ${FACTORY_GIT_AUTHOR_EMAIL:-factory-bot@ai-sdlc-factory.test}
      # What a project gets when its .factory/project.json "limits" do not say (see docs/configuration.md).
      FACTORY_DEFAULT_BUILD_ROUNDS: ${FACTORY_DEFAULT_BUILD_ROUNDS:-3}
      FACTORY_DEFAULT_CLARIFICATION_ROUNDS: ${FACTORY_DEFAULT_CLARIFICATION_ROUNDS:-3}
      FACTORY_DEFAULT_REVISIONS_PER_PULL_REQUEST: ${FACTORY_DEFAULT_REVISIONS_PER_PULL_REQUEST:-3}
      # Token limits (see docs/configuration.md). 0 = no limit. A project can only lower the per-run maximum.
      FACTORY_MAX_TOKENS_PER_RUN: ${FACTORY_MAX_TOKENS_PER_RUN:-0}
      FACTORY_DAILY_TOKEN_LIMIT: ${FACTORY_DAILY_TOKEN_LIMIT:-0}
      FACTORY_REPO_DAILY_TOKEN_LIMIT: ${FACTORY_REPO_DAILY_TOKEN_LIMIT:-0}
      # A /qa run estimated above this many tokens waits for "/qa go" (a project can set limits.confirm_over). 0 = never wait.
      FACTORY_CONFIRM_OVER_TOKENS: ${FACTORY_CONFIRM_OVER_TOKENS:-0}
      # Whether a repository may bring its own sandbox image (.factory/Dockerfile). Off by default; read the warning in docs/configuration.md first.
      FACTORY_ALLOW_REPO_IMAGES: ${FACTORY_ALLOW_REPO_IMAGES:-false}
      # The weekly report on what repeats (see docs/operations.md). It only reads the logs and writes a file; set the repository to also open it as a ticket.
      FACTORY_IMPROVEMENT: ${FACTORY_IMPROVEMENT:-true}
      FACTORY_IMPROVEMENT_REPO: ${FACTORY_IMPROVEMENT_REPO:-}
      FACTORY_EGRESS_DENIED_LOG: /var/log/egress/denied.jsonl
      # The janitor: removes leftover checkouts and reports old work-in-progress branches (see docs/operations.md).
      FACTORY_JANITOR: ${FACTORY_JANITOR:-true}
      FACTORY_JANITOR_INTERVAL_HOURS: ${FACTORY_JANITOR_INTERVAL_HOURS:-24}
      FACTORY_JANITOR_CHECKOUT_DAYS: ${FACTORY_JANITOR_CHECKOUT_DAYS:-2}
      FACTORY_JANITOR_WIP_DAYS: ${FACTORY_JANITOR_WIP_DAYS:-30}
      FACTORY_JANITOR_DELETE_WIP: ${FACTORY_JANITOR_DELETE_WIP:-false}
      FACTORY_WORKSPACE_ROOT: ${FACTORY_WORKSPACE_ROOT:?Set FACTORY_WORKSPACE_ROOT in .env}
      # Only read to name the model each role is configured with in a run record.
      FACTORY_AGENTS_DIR: /etc/factory
    # Runs as the host user so the checkouts it creates can be read, changed and deleted by that user.
    user: "${FACTORY_UID:-1000}:${FACTORY_GID:-1000}"
    volumes:
      - ${FACTORY_WORKSPACE_ROOT}:${FACTORY_WORKSPACE_ROOT}
      - ${FACTORY_GLOBAL_CONFIG:-../agents}:/etc/factory:ro
      # The egress proxy's log of refused hosts, read only, for the weekly report.
      - egress-log:/var/log/egress:ro
    networks: [control, forge]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    stop_grace_period: 30s

  # The only way out for disposable agent containers. Each profile has its own internal network and its own
  # address here, so a container can only reach the address of its own profile; the proxy tunnels HTTPS to
  # the hosts that profile lists and logs every decision (docker compose logs egress-proxy).
  egress-proxy:
    <<: *hardened
    image: ai-sdlc-factory/egress-proxy:local
    build:
      context: ..
      dockerfile: src/egress-proxy/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      EGRESS_PROFILES_FILE: /etc/egress/profiles.json
      # enforce (default), audit (allow every HTTPS host and log it) or open (this proxy is bypassed; see SANDBOX_EGRESS)
      EGRESS_MODE: ${SANDBOX_EGRESS:-enforce}
      EGRESS_LISTEN_MAP: model=${SANDBOX_NET_BASE:-10.250}.1.2,packages=${SANDBOX_NET_BASE:-10.250}.2.2,developer=${SANDBOX_NET_BASE:-10.250}.3.2
      # Every refusal is also written here, one JSON line each (at most 10 MB), for the factory's weekly report.
      EGRESS_DENIED_LOG: /var/log/egress/denied.jsonl
    volumes:
      # Your own rules: set EGRESS_PROFILES in .env to a file in the same format (see src/egress-proxy/ALLOWLIST.md).
      - ${EGRESS_PROFILES:-../src/egress-proxy/profiles.json}:/etc/egress/profiles.json:ro
      - egress-log:/var/log/egress
    networks:
      egress:
      sandbox-model:
        ipv4_address: ${SANDBOX_NET_BASE:-10.250}.1.2
      sandbox-packages:
        ipv4_address: ${SANDBOX_NET_BASE:-10.250}.2.2
      sandbox-developer:
        ipv4_address: ${SANDBOX_NET_BASE:-10.250}.3.2
    healthcheck:
      test: ["CMD", "dotnet", "AiSdlcFactory.EgressProxy.dll", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # The only service with Docker access. It starts disposable agent containers with fixed isolation
  # settings (see src/sandbox-launcher/README.md) and has no Forgejo credentials.
  sandbox-launcher:
    <<: *hardened
    image: ai-sdlc-factory/sandbox-launcher:local
    build:
      context: ..
      dockerfile: src/sandbox-launcher/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_healthy
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID in .env (stat -c %g /var/run/docker.sock)}"
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      FACTORY_WORKSPACE_ROOT: ${FACTORY_WORKSPACE_ROOT:?Set FACTORY_WORKSPACE_ROOT in .env}
      SANDBOX_IMAGES: dotnet=ai-sdlc-factory/sandbox-dotnet:local;python=ai-sdlc-factory/sandbox-python:local;node=ai-sdlc-factory/sandbox-node:local;dotnet-node=ai-sdlc-factory/sandbox-dotnet-node:local;python-node=ai-sdlc-factory/sandbox-python-node:local;full=ai-sdlc-factory/sandbox-full:local;browser=ai-sdlc-factory/sandbox-browser:local
      # enforce / audit: through the egress proxy. open: no restrictions, an ordinary internet-connected network.
      SANDBOX_EGRESS_MODE: ${SANDBOX_EGRESS:-enforce}
      SANDBOX_OPEN_NETWORK: ${COMPOSE_PROJECT_NAME:-ai-sdlc-factory}_sandbox-open
      SANDBOX_NETWORKS: model=${COMPOSE_PROJECT_NAME:-ai-sdlc-factory}_sandbox-model;packages=${COMPOSE_PROJECT_NAME:-ai-sdlc-factory}_sandbox-packages;developer=${COMPOSE_PROJECT_NAME:-ai-sdlc-factory}_sandbox-developer
      SANDBOX_PROXIES: model=http://${SANDBOX_NET_BASE:-10.250}.1.2:3128;packages=http://${SANDBOX_NET_BASE:-10.250}.2.2:3128;developer=http://${SANDBOX_NET_BASE:-10.250}.3.2:3128
      SANDBOX_UID: ${FACTORY_UID:-1000}
      SANDBOX_GID: ${FACTORY_GID:-1000}
      FACTORY_GLOBAL_CONFIG: ${FACTORY_GLOBAL_CONFIG:-}
      # The model every agent uses unless its role file names another (see the controller's setting of the same name).
      FACTORY_MODEL: ${FACTORY_MODEL:-}
      SANDBOX_AUTH_VOLUME: ${COMPOSE_PROJECT_NAME:-ai-sdlc-factory}_opencode-data
      # Limits of each sandbox and how many run at once (see docs/configuration.md). SANDBOX_AUTH_READONLY=true keeps an agent from changing the login.
      SANDBOX_MEMORY_BYTES: ${SANDBOX_MEMORY_BYTES:-2147483648}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-2}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-1024}
      SANDBOX_MAX_RUN_SECONDS: ${SANDBOX_MAX_RUN_SECONDS:-1800}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-2}
      SANDBOX_AUTH_READONLY: ${SANDBOX_AUTH_READONLY:-false}
      # The same switch as the controller's: the launcher refuses to build a repository's image unless it is true.
      FACTORY_ALLOW_REPO_IMAGES: ${FACTORY_ALLOW_REPO_IMAGES:-false}
      # Repository images older than this many days (0 = never) and unused are removed once a day.
      FACTORY_JANITOR_IMAGE_DAYS: ${FACTORY_JANITOR_IMAGE_DAYS:-60}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only: the launcher only checks that a workspace exists before mounting it into a sandbox.
      - ${FACTORY_WORKSPACE_ROOT}:${FACTORY_WORKSPACE_ROOT}:ro
    networks: [control]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    stop_grace_period: 30s

  # Not a service: builds the image the launcher starts for .NET projects.
  # docker compose --profile images build sandbox-image-dotnet
  sandbox-image-dotnet:
    image: ai-sdlc-factory/sandbox-dotnet:local
    build:
      context: ../sandboxes
      dockerfile: dotnet/Dockerfile
    profiles: ["images"]
    entrypoint: ["true"]
    restart: "no"

  sandbox-image-node:
    image: ai-sdlc-factory/sandbox-node:local
    build:
      context: ../sandboxes
      dockerfile: node/Dockerfile
    profiles: ["images"]
    entrypoint: ["true"]
    restart: "no"

  sandbox-image-python:
    image: ai-sdlc-factory/sandbox-python:local
    build:
      context: ../sandboxes
      dockerfile: python/Dockerfile
    profiles: ["images"]
    entrypoint: ["true"]
    restart: "no"

  sandbox-image-dotnet-node:
    image: ai-sdlc-factory/sandbox-dotnet-node:local
    build:
      context: ../sandboxes
      dockerfile: dotnet-node/Dockerfile
    profiles: ["images"]
    entrypoint: ["true"]
    restart: "no"

  sandbox-image-python-node:
    image: ai-sdlc-factory/sandbox-python-node:local
    build:
      context: ../sandboxes
      dockerfile: python-node/Dockerfile
    profiles: ["images"]
    entrypoint: ["true"]
    restart: "no"

  sandbox-image-full:
    image: ai-sdlc-factory/sandbox-full:local
    build:
      context: ../sandboxes
      dockerfile: full/Dockerfile
    profiles: ["images"]
    entrypoint: ["true"]
    restart: "no"

  sandbox-image-browser:
    image: ai-sdlc-factory/sandbox-browser:local
    build:
      context: ../sandboxes
      dockerfile: browser/Dockerfile
    profiles: ["images"]
    entrypoint: ["true"]
    restart: "no"

  integration-tests:
    # The api's own test image, running only its tests of the deployed stack (they skip themselves anywhere else).
    image: ai-sdlc-factory/api-test:local
    build:
      context: ..
      dockerfile: src/api/Dockerfile
      target: test
    command: ["dotnet", "test", "tests/api", "-c", "Release", "--no-build", "--filter", "Category=Deployed"]
    profiles: ["test"]
    restart: "no"
    networks: [control]
    depends_on:
      api:
        condition: service_healthy
      controller:
        condition: service_healthy
    environment:
      API_TEST_URL: http://api:8000
      TEMPORAL_TEST_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_TEST_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      FACTORY_HOSTS: ${FACTORY_HOSTS:?Set FACTORY_HOSTS in .env}

  # Gives the OpenCode login volume to the factory user. The login helper and the disposable sandboxes
  # run as that user, so they can share one login without anyone being root.
  opencode-data-init:
    <<: *opencode-tools
    user: "0:0"
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
    volumes:
      - opencode-data:/data/opencode
    command:
      - sh
      - -c
      - chown -R ${FACTORY_UID:-1000}:${FACTORY_GID:-1000} /data/opencode && chmod 700 /data/opencode

  # Signs OpenCode in with a ChatGPT account (see docs/opencode-login.md). The login is written to the
  # opencode-data volume, which the sandbox launcher mounts into runs that call the model.
  opencode-login:
    <<: *opencode-tools
    depends_on:
      opencode-data-init:
        condition: service_completed_successfully
    volumes:
      - opencode-data:/data/opencode
    ports:
      - "127.0.0.1:1455:1455"
    command: ["opencode", "auth", "login", "--provider", "openai", "--method", "ChatGPT Pro/Plus (browser)"]

networks:
  control:
  hooks:
  forge:
  agents:
  egress:
  # Internal: no route out and no external DNS. The fixed subnets give each profile's proxy a stable address;
  # change SANDBOX_NET_BASE in .env if 10.250.x.x clashes with a network you use.
  sandbox-model:
    internal: true
    ipam:
      config:
        - subnet: ${SANDBOX_NET_BASE:-10.250}.1.0/24
  sandbox-packages:
    internal: true
    ipam:
      config:
        - subnet: ${SANDBOX_NET_BASE:-10.250}.2.0/24
  sandbox-developer:
    internal: true
    ipam:
      config:
        - subnet: ${SANDBOX_NET_BASE:-10.250}.3.0/24

volumes:
  egress-log:
  temporal-data:   # Temporal's SQLite file (compose.postgres.yaml adds postgres-data instead)
  opencode-data:
