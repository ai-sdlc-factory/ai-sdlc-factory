name: dev-foundry

# Networks limit what each service can reach:
#   data    PostgreSQL and its direct clients
#   control Temporal clients and the trusted controller services
#   hooks   Forgejo webhook delivery to the controller API
#   forge   Forgejo API access for the controller (ticket comments, later branches and PRs)
#   agents  Temporal and the untrusted OpenCode worker only
#   sandbox (dev-foundry_sandbox) is created by the sandbox launcher for the disposable agent
#           containers it starts; no Compose service ever joins it
x-opencode: &opencode
  image: dev-foundry/opencode-worker:local
  build:
    context: ..
    dockerfile: services/opencode-worker/Dockerfile
    target: runtime
  profiles: ["opencode"]
  networks: [agents]
  user: "${FACTORY_UID:-1000}:${FACTORY_GID:-1000}"
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 2g
  cpus: 2
  tmpfs:
    - /tmp:size=512m,mode=1777

x-hardened: &hardened
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 512m
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      FORGEJO_DB_PASSWORD: ${FORGEJO_DB_PASSWORD:?Set FORGEJO_DB_PASSWORD in .env}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
    networks: [data]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    networks: [data]
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD:?Set FORGEJO_DB_PASSWORD in .env}
      FORGEJO__server__DOMAIN: localhost
      FORGEJO__server__ROOT_URL: http://localhost:${FORGEJO_HTTP_PORT:-3000}/
      FORGEJO__server__SSH_DOMAIN: localhost
      FORGEJO__server__SSH_PORT: ${FORGEJO_SSH_PORT:-2222}
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__service__ENABLE_NOTIFY_MAIL: "true"
      FORGEJO__mailer__ENABLED: "true"
      FORGEJO__mailer__PROTOCOL: smtp
      FORGEJO__mailer__SMTP_ADDR: ${SMTP_HOST:-mailpit}
      FORGEJO__mailer__SMTP_PORT: ${SMTP_PORT:-1025}
      FORGEJO__mailer__FROM: forgejo@dev-foundry.test
      FORGEJO__webhook__ALLOWED_HOST_LIST: external,api
    networks: [data, hooks, forge]
    ports:
      - "127.0.0.1:${FORGEJO_HTTP_PORT:-3000}:3000"
      - "127.0.0.1:${FORGEJO_SSH_PORT:-2222}:22"
    volumes:
      - forgejo-data:/data

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
    networks: [data]
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

  temporal-schema:
    image: temporalio/admin-tools:1.32.1
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
    networks: [data]
    volumes:
      - ./temporal/setup-schema.sh:/scripts/setup-schema.sh:ro
    entrypoint: ["/bin/sh", "/scripts/setup-schema.sh"]

  temporal:
    image: temporalio/server:1.32.1
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
      BIND_ON_IP: 0.0.0.0
      SQL_MAX_CONNS: "10"
      SQL_MAX_IDLE_CONNS: "10"
      SQL_VIS_MAX_CONNS: "5"
      SQL_VIS_MAX_IDLE_CONNS: "5"
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig.yaml
    networks: [data, control, agents]
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
    volumes:
      - ./temporal/dynamicconfig.yaml:/etc/temporal/dynamicconfig.yaml:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  temporal-namespace:
    image: temporalio/admin-tools:1.32.1
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_RETENTION: ${TEMPORAL_RETENTION:-7d}
    networks: [control]
    volumes:
      - ./temporal/setup-namespace.sh:/scripts/setup-namespace.sh:ro
    entrypoint: ["/bin/sh", "/scripts/setup-namespace.sh"]

  temporal-ui:
    image: temporalio/ui:2.57.0
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
    networks: [control]
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8080}:8080"

  api:
    <<: *hardened
    image: dev-foundry/api:local
    build:
      context: ..
      dockerfile: services/api/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-factory-events}
      FORGEJO_WEBHOOK_SECRET: ${FORGEJO_WEBHOOK_SECRET:?Set FORGEJO_WEBHOOK_SECRET in .env}
    networks: [control, hooks]
    ports:
      - "127.0.0.1:${CONTROLLER_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "dotnet", "DevFoundry.Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  controller:
    <<: *hardened
    image: dev-foundry/controller:local
    build:
      context: ..
      dockerfile: services/controller/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-factory-events}
      FORGEJO_URL: http://forgejo:3000
      FORGEJO_BOT_TOKEN: ${FORGEJO_BOT_TOKEN:-}
      FACTORY_WORKSPACE_ROOT: ${FACTORY_WORKSPACE_ROOT:?Set FACTORY_WORKSPACE_ROOT in .env}
    # Runs as the host user so the checkouts it creates can be read, changed and deleted by that user.
    user: "${FACTORY_UID:-1000}:${FACTORY_GID:-1000}"
    volumes:
      - ${FACTORY_WORKSPACE_ROOT}:${FACTORY_WORKSPACE_ROOT}
    networks: [control, forge]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    stop_grace_period: 30s

  # The only service with Docker access. It starts disposable agent containers with fixed isolation
  # settings (see services/sandbox-launcher/README.md) and has no Forgejo credentials.
  sandbox-launcher:
    <<: *hardened
    image: dev-foundry/sandbox-launcher:local
    build:
      context: ..
      dockerfile: services/sandbox-launcher/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID in .env (stat -c %g /var/run/docker.sock)}"
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      FACTORY_WORKSPACE_ROOT: ${FACTORY_WORKSPACE_ROOT:?Set FACTORY_WORKSPACE_ROOT in .env}
      SANDBOX_IMAGES: dotnet=dev-foundry/sandbox-dotnet:local;python=dev-foundry/sandbox-python:local
      SANDBOX_NETWORK: dev-foundry_sandbox
      SANDBOX_UID: ${FACTORY_UID:-1000}
      SANDBOX_GID: ${FACTORY_GID:-1000}
      FACTORY_GLOBAL_CONFIG: ${FACTORY_GLOBAL_CONFIG:-}
      SANDBOX_AUTH_VOLUME: ${COMPOSE_PROJECT_NAME:-dev-foundry}_opencode-data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only: the launcher only checks that a workspace exists before mounting it into a sandbox.
      - ${FACTORY_WORKSPACE_ROOT}:${FACTORY_WORKSPACE_ROOT}:ro
    networks: [control]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    stop_grace_period: 30s

  # Not a service: builds the image the launcher starts for .NET projects.
  # docker compose --profile images build sandbox-image-dotnet
  sandbox-image-dotnet:
    image: dev-foundry/sandbox-dotnet:local
    build:
      context: ../sandboxes
      dockerfile: dotnet/Dockerfile
    profiles: ["images"]
    entrypoint: ["true"]
    restart: "no"

  sandbox-image-python:
    image: dev-foundry/sandbox-python:local
    build:
      context: ../sandboxes
      dockerfile: python/Dockerfile
    profiles: ["images"]
    entrypoint: ["true"]
    restart: "no"

  integration-tests:
    image: dev-foundry/integration-tests:local
    build:
      context: ..
      dockerfile: tests/integration/Dockerfile
    profiles: ["test"]
    restart: "no"
    networks: [control]
    depends_on:
      api:
        condition: service_healthy
      controller:
        condition: service_healthy
    environment:
      API_TEST_URL: http://api:8000
      TEMPORAL_TEST_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_TEST_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      FORGEJO_WEBHOOK_SECRET: ${FORGEJO_WEBHOOK_SECRET:?Set FORGEJO_WEBHOOK_SECRET in .env}

  # Gives the OpenCode login volume to the factory user. The login service, the demo worker and the
  # disposable sandboxes all run as that user, so they can share one login without anyone being root.
  opencode-data-init:
    <<: *opencode
    profiles: ["opencode", "opencode-tools"]
    user: "0:0"
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
    restart: "no"
    volumes:
      - opencode-data:/data/opencode
    command:
      - sh
      - -c
      - chown -R ${FACTORY_UID:-1000}:${FACTORY_GID:-1000} /data/opencode && chmod 700 /data/opencode

  opencode-worker:
    <<: *opencode
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
      opencode-data-init:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      OPENCODE_TASK_QUEUE: ${OPENCODE_TASK_QUEUE:-opencode-tasks}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-openai/gpt-6.1-sol}
    volumes:
      - opencode-data:/data/opencode
    stop_grace_period: 30s

  opencode-login:
    <<: *opencode
    profiles: ["opencode-tools"]
    restart: "no"
    depends_on:
      opencode-data-init:
        condition: service_completed_successfully
    volumes:
      - opencode-data:/data/opencode
    ports:
      - "127.0.0.1:1455:1455"
    command: ["opencode", "auth", "login", "--provider", "openai", "--method", "ChatGPT Pro/Plus (browser)"]

  opencode-demo:
    <<: *opencode
    profiles: ["opencode-tools"]
    restart: "no"
    depends_on:
      controller:
        condition: service_started
      opencode-worker:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-factory-events}
      OPENCODE_TASK_QUEUE: ${OPENCODE_TASK_QUEUE:-opencode-tasks}
    command: ["dotnet", "DevFoundry.OpenCodeWorker.dll", "submit"]

networks:
  data:
  control:
  hooks:
  forge:
  agents:

volumes:
  postgres-data:
  forgejo-data:
  pgadmin-data:
  mailpit-data:
  opencode-data:
