name: dev-foundry

# Networks limit what each service can reach:
#   data    PostgreSQL and its direct clients
#   control Temporal clients and the trusted controller services
#   hooks   Forgejo webhook delivery to the controller API
#   forge   Forgejo API and git access for the controller (ticket comments, branches, pull requests)
#   agents  the OpenCode login helper only: internet access for the browser login, no factory service
#   egress  the egress proxy's way to the internet; nothing else joins it
#   sandbox-model, sandbox-packages, sandbox-developer
#           one internal network (no route out, no external DNS) per egress profile for the disposable agent
#           containers the sandbox launcher starts. Only the egress proxy joins them, and it lets a sandbox
#           reach just the hosts its profile lists (egress/profiles.json)

# Helpers for the OpenCode login. They run from the Python sandbox image (which already has OpenCode),
# only when asked for (profile opencode-tools), as the factory user and with no capabilities.
x-opencode-tools: &opencode-tools
  image: dev-foundry/sandbox-python:local
  build:
    context: ../sandboxes
    dockerfile: python/Dockerfile
  profiles: ["opencode-tools"]
  networks: [agents]
  user: "${FACTORY_UID:-1000}:${FACTORY_GID:-1000}"
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 1g
  cpus: 1
  restart: "no"
  environment:
    # The login volume is mounted at /data/opencode, so OpenCode writes auth.json to its root,
    # which is where the sandboxes look for it.
    HOME: /tmp
    XDG_DATA_HOME: /data
    XDG_CACHE_HOME: /tmp/cache
    XDG_CONFIG_HOME: /tmp/config
  tmpfs:
    - /tmp:size=256m,mode=1777

x-hardened: &hardened
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 512m
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      FORGEJO_DB_PASSWORD: ${FORGEJO_DB_PASSWORD:?Set FORGEJO_DB_PASSWORD in .env}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
    networks: [data]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    networks: [data]
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD:?Set FORGEJO_DB_PASSWORD in .env}
      FORGEJO__server__DOMAIN: localhost
      FORGEJO__server__ROOT_URL: http://localhost:${FORGEJO_HTTP_PORT:-3000}/
      FORGEJO__server__SSH_DOMAIN: localhost
      FORGEJO__server__SSH_PORT: ${FORGEJO_SSH_PORT:-2222}
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__service__ENABLE_NOTIFY_MAIL: "true"
      FORGEJO__mailer__ENABLED: "true"
      FORGEJO__mailer__PROTOCOL: smtp
      FORGEJO__mailer__SMTP_ADDR: ${SMTP_HOST:-mailpit}
      FORGEJO__mailer__SMTP_PORT: ${SMTP_PORT:-1025}
      FORGEJO__mailer__FROM: forgejo@dev-foundry.test
      FORGEJO__webhook__ALLOWED_HOST_LIST: external,api
    networks: [data, hooks, forge]
    ports:
      - "127.0.0.1:${FORGEJO_HTTP_PORT:-3000}:3000"
      - "127.0.0.1:${FORGEJO_SSH_PORT:-2222}:22"
    volumes:
      - forgejo-data:/data

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
    networks: [data]
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

  temporal-schema:
    image: temporalio/admin-tools:1.32.1
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
    networks: [data]
    volumes:
      - ./temporal/setup-schema.sh:/scripts/setup-schema.sh:ro
    entrypoint: ["/bin/sh", "/scripts/setup-schema.sh"]

  temporal:
    image: temporalio/server:1.32.1
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD in .env}
      BIND_ON_IP: 0.0.0.0
      SQL_MAX_CONNS: "10"
      SQL_MAX_IDLE_CONNS: "10"
      SQL_VIS_MAX_CONNS: "5"
      SQL_VIS_MAX_IDLE_CONNS: "5"
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig.yaml
    networks: [data, control, agents]
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
    volumes:
      - ./temporal/dynamicconfig.yaml:/etc/temporal/dynamicconfig.yaml:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  temporal-namespace:
    image: temporalio/admin-tools:1.32.1
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_RETENTION: ${TEMPORAL_RETENTION:-7d}
    networks: [control]
    volumes:
      - ./temporal/setup-namespace.sh:/scripts/setup-namespace.sh:ro
    entrypoint: ["/bin/sh", "/scripts/setup-namespace.sh"]

  temporal-ui:
    image: temporalio/ui:2.57.0
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
    networks: [control]
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8080}:8080"

  api:
    <<: *hardened
    image: dev-foundry/api:local
    build:
      context: ..
      dockerfile: services/api/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-factory-events}
      FORGEJO_WEBHOOK_SECRET: ${FORGEJO_WEBHOOK_SECRET:?Set FORGEJO_WEBHOOK_SECRET in .env}
    networks: [control, hooks]
    ports:
      - "127.0.0.1:${CONTROLLER_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "dotnet", "DevFoundry.Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  controller:
    <<: *hardened
    image: dev-foundry/controller:local
    build:
      context: ..
      dockerfile: services/controller/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-factory-events}
      FORGEJO_URL: http://forgejo:3000
      # How a person opens the Temporal web UI; used for the link to a run's record in ticket comments.
      TEMPORAL_UI_URL: ${TEMPORAL_UI_URL:-http://localhost:${TEMPORAL_UI_PORT:-8080}}
      FORGEJO_BOT_TOKEN: ${FORGEJO_BOT_TOKEN:-}
      # The factory only revises pull requests this account opened.
      FORGEJO_BOT_LOGIN: ${FORGEJO_BOT_LOGIN:-factory-bot}
      # What a project gets when its .factory/project.json "limits" do not say (see docs/configuration.md).
      FACTORY_DEFAULT_BUILD_ROUNDS: ${FACTORY_DEFAULT_BUILD_ROUNDS:-3}
      FACTORY_DEFAULT_CLARIFICATION_ROUNDS: ${FACTORY_DEFAULT_CLARIFICATION_ROUNDS:-3}
      FACTORY_DEFAULT_REVISIONS_PER_PULL_REQUEST: ${FACTORY_DEFAULT_REVISIONS_PER_PULL_REQUEST:-3}
      # Token limits (see docs/configuration.md). 0 = no limit. A project can only lower the per-run maximum.
      FACTORY_MAX_TOKENS_PER_RUN: ${FACTORY_MAX_TOKENS_PER_RUN:-0}
      FACTORY_DAILY_TOKEN_LIMIT: ${FACTORY_DAILY_TOKEN_LIMIT:-0}
      FACTORY_REPO_DAILY_TOKEN_LIMIT: ${FACTORY_REPO_DAILY_TOKEN_LIMIT:-0}
      # A /qa run estimated above this many tokens waits for "/qa go" (a project can set limits.confirm_over). 0 = never wait.
      FACTORY_CONFIRM_OVER_TOKENS: ${FACTORY_CONFIRM_OVER_TOKENS:-0}
      # Whether a repository may bring its own sandbox image (.factory/Dockerfile). Off by default; read the warning in docs/configuration.md first.
      FACTORY_ALLOW_REPO_IMAGES: ${FACTORY_ALLOW_REPO_IMAGES:-false}
      # The weekly report on what repeats (see docs/operations.md). It only reads the logs and writes a file; set the repository to also open it as a ticket.
      FACTORY_IMPROVEMENT: ${FACTORY_IMPROVEMENT:-true}
      FACTORY_IMPROVEMENT_REPO: ${FACTORY_IMPROVEMENT_REPO:-}
      FACTORY_EGRESS_DENIED_LOG: /var/log/egress/denied.jsonl
      # The janitor: removes leftover checkouts and reports old work-in-progress branches (see docs/operations.md).
      FACTORY_JANITOR: ${FACTORY_JANITOR:-true}
      FACTORY_JANITOR_INTERVAL_HOURS: ${FACTORY_JANITOR_INTERVAL_HOURS:-24}
      FACTORY_JANITOR_CHECKOUT_DAYS: ${FACTORY_JANITOR_CHECKOUT_DAYS:-2}
      FACTORY_JANITOR_WIP_DAYS: ${FACTORY_JANITOR_WIP_DAYS:-30}
      FACTORY_JANITOR_DELETE_WIP: ${FACTORY_JANITOR_DELETE_WIP:-false}
      FACTORY_WORKSPACE_ROOT: ${FACTORY_WORKSPACE_ROOT:?Set FACTORY_WORKSPACE_ROOT in .env}
      # Only read to name the model each role is configured with in a run record.
      FACTORY_AGENTS_DIR: /etc/factory
    # Runs as the host user so the checkouts it creates can be read, changed and deleted by that user.
    user: "${FACTORY_UID:-1000}:${FACTORY_GID:-1000}"
    volumes:
      - ${FACTORY_WORKSPACE_ROOT}:${FACTORY_WORKSPACE_ROOT}
      - ${FACTORY_GLOBAL_CONFIG:-../agents}:/etc/factory:ro
      # The egress proxy's log of refused hosts, read only, for the weekly report.
      - egress-log:/var/log/egress:ro
    networks: [control, forge]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    stop_grace_period: 30s

  # The only way out for disposable agent containers. Each profile has its own internal network and its own
  # address here, so a container can only reach the address of its own profile; the proxy tunnels HTTPS to
  # the hosts that profile lists and logs every decision (docker compose logs egress-proxy).
  egress-proxy:
    <<: *hardened
    image: dev-foundry/egress-proxy:local
    build:
      context: ..
      dockerfile: services/egress-proxy/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      EGRESS_PROFILES_FILE: /etc/egress/profiles.json
      # enforce (default), audit (allow every HTTPS host and log it) or open (this proxy is bypassed; see SANDBOX_EGRESS)
      EGRESS_MODE: ${SANDBOX_EGRESS:-enforce}
      EGRESS_LISTEN_MAP: model=${SANDBOX_NET_BASE:-10.250}.1.2,packages=${SANDBOX_NET_BASE:-10.250}.2.2,developer=${SANDBOX_NET_BASE:-10.250}.3.2
      # Every refusal is also written here, one JSON line each (at most 10 MB), for the factory's weekly report.
      EGRESS_DENIED_LOG: /var/log/egress/denied.jsonl
    volumes:
      # Your own rules: set EGRESS_PROFILES in .env to a file in the same format (see egress/README.md).
      - ${EGRESS_PROFILES:-../egress/profiles.json}:/etc/egress/profiles.json:ro
      - egress-log:/var/log/egress
    networks:
      egress:
      sandbox-model:
        ipv4_address: ${SANDBOX_NET_BASE:-10.250}.1.2
      sandbox-packages:
        ipv4_address: ${SANDBOX_NET_BASE:-10.250}.2.2
      sandbox-developer:
        ipv4_address: ${SANDBOX_NET_BASE:-10.250}.3.2
    healthcheck:
      test: ["CMD", "dotnet", "DevFoundry.EgressProxy.dll", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # The only service with Docker access. It starts disposable agent containers with fixed isolation
  # settings (see services/sandbox-launcher/README.md) and has no Forgejo credentials.
  sandbox-launcher:
    <<: *hardened
    image: dev-foundry/sandbox-launcher:local
    build:
      context: ..
      dockerfile: services/sandbox-launcher/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_healthy
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID in .env (stat -c %g /var/run/docker.sock)}"
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      FACTORY_WORKSPACE_ROOT: ${FACTORY_WORKSPACE_ROOT:?Set FACTORY_WORKSPACE_ROOT in .env}
      SANDBOX_IMAGES: dotnet=dev-foundry/sandbox-dotnet:local;python=dev-foundry/sandbox-python:local;node=dev-foundry/sandbox-node:local;dotnet-node=dev-foundry/sandbox-dotnet-node:local;python-node=dev-foundry/sandbox-python-node:local;full=dev-foundry/sandbox-full:local;browser=dev-foundry/sandbox-browser:local
      # enforce / audit: through the egress proxy. open: no restrictions, an ordinary internet-connected network.
      SANDBOX_EGRESS_MODE: ${SANDBOX_EGRESS:-enforce}
      SANDBOX_OPEN_NETWORK: ${COMPOSE_PROJECT_NAME:-dev-foundry}_sandbox-open
      SANDBOX_NETWORKS: model=${COMPOSE_PROJECT_NAME:-dev-foundry}_sandbox-model;packages=${COMPOSE_PROJECT_NAME:-dev-foundry}_sandbox-packages;developer=${COMPOSE_PROJECT_NAME:-dev-foundry}_sandbox-developer
      SANDBOX_PROXIES: model=http://${SANDBOX_NET_BASE:-10.250}.1.2:3128;packages=http://${SANDBOX_NET_BASE:-10.250}.2.2:3128;developer=http://${SANDBOX_NET_BASE:-10.250}.3.2:3128
      SANDBOX_UID: ${FACTORY_UID:-1000}
      SANDBOX_GID: ${FACTORY_GID:-1000}
      FACTORY_GLOBAL_CONFIG: ${FACTORY_GLOBAL_CONFIG:-}
      SANDBOX_AUTH_VOLUME: ${COMPOSE_PROJECT_NAME:-dev-foundry}_opencode-data
      # The same switch as the controller's: the launcher refuses to build a repository's image unless it is true.
      FACTORY_ALLOW_REPO_IMAGES: ${FACTORY_ALLOW_REPO_IMAGES:-false}
      # Repository images older than this many days (0 = never) and unused are removed once a day.
      FACTORY_JANITOR_IMAGE_DAYS: ${FACTORY_JANITOR_IMAGE_DAYS:-60}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only: the launcher only checks that a workspace exists before mounting it into a sandbox.
      - ${FACTORY_WORKSPACE_ROOT}:${FACTORY_WORKSPACE_ROOT}:ro
    networks: [control]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    stop_grace_period: 30s

  # Not a service: builds the image the launcher starts for .NET projects.
  # docker compose --profile images build sandbox-image-dotnet
  sandbox-image-dotnet:
    image: dev-foundry/sandbox-dotnet:local
    build:
      context: ../sandboxes
      dockerfile: dotnet/Dockerfile
    profiles: ["images"]
    entrypoint: ["true"]
    restart: "no"

  sandbox-image-node:
    image: dev-foundry/sandbox-node:local
    build:
      context: ../sandboxes
      dockerfile: node/Dockerfile
    profiles: ["images"]
    entrypoint: ["true"]
    restart: "no"

  sandbox-image-python:
    image: dev-foundry/sandbox-python:local
    build:
      context: ../sandboxes
      dockerfile: python/Dockerfile
    profiles: ["images"]
    entrypoint: ["true"]
    restart: "no"

  sandbox-image-dotnet-node:
    image: dev-foundry/sandbox-dotnet-node:local
    build:
      context: ../sandboxes
      dockerfile: dotnet-node/Dockerfile
    profiles: ["images"]
    entrypoint: ["true"]
    restart: "no"

  sandbox-image-python-node:
    image: dev-foundry/sandbox-python-node:local
    build:
      context: ../sandboxes
      dockerfile: python-node/Dockerfile
    profiles: ["images"]
    entrypoint: ["true"]
    restart: "no"

  sandbox-image-full:
    image: dev-foundry/sandbox-full:local
    build:
      context: ../sandboxes
      dockerfile: full/Dockerfile
    profiles: ["images"]
    entrypoint: ["true"]
    restart: "no"

  sandbox-image-browser:
    image: dev-foundry/sandbox-browser:local
    build:
      context: ../sandboxes
      dockerfile: browser/Dockerfile
    profiles: ["images"]
    entrypoint: ["true"]
    restart: "no"

  integration-tests:
    image: dev-foundry/integration-tests:local
    build:
      context: ..
      dockerfile: tests/integration/Dockerfile
    profiles: ["test"]
    restart: "no"
    networks: [control]
    depends_on:
      api:
        condition: service_healthy
      controller:
        condition: service_healthy
    environment:
      API_TEST_URL: http://api:8000
      TEMPORAL_TEST_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_TEST_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      FORGEJO_WEBHOOK_SECRET: ${FORGEJO_WEBHOOK_SECRET:?Set FORGEJO_WEBHOOK_SECRET in .env}

  # Gives the OpenCode login volume to the factory user. The login helper and the disposable sandboxes
  # run as that user, so they can share one login without anyone being root.
  opencode-data-init:
    <<: *opencode-tools
    user: "0:0"
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
    volumes:
      - opencode-data:/data/opencode
    command:
      - sh
      - -c
      - chown -R ${FACTORY_UID:-1000}:${FACTORY_GID:-1000} /data/opencode && chmod 700 /data/opencode

  # Signs OpenCode in with a ChatGPT account (see docs/opencode-login.md). The login is written to the
  # opencode-data volume, which the sandbox launcher mounts into runs that call the model.
  opencode-login:
    <<: *opencode-tools
    depends_on:
      opencode-data-init:
        condition: service_completed_successfully
    volumes:
      - opencode-data:/data/opencode
    ports:
      - "127.0.0.1:1455:1455"
    command: ["opencode", "auth", "login", "--provider", "openai", "--method", "ChatGPT Pro/Plus (browser)"]

networks:
  data:
  control:
  hooks:
  forge:
  agents:
  egress:
  # Internal: no route out and no external DNS. The fixed subnets give each profile's proxy a stable address;
  # change SANDBOX_NET_BASE in .env if 10.250.x.x clashes with a network you use.
  sandbox-model:
    internal: true
    ipam:
      config:
        - subnet: ${SANDBOX_NET_BASE:-10.250}.1.0/24
  sandbox-packages:
    internal: true
    ipam:
      config:
        - subnet: ${SANDBOX_NET_BASE:-10.250}.2.0/24
  sandbox-developer:
    internal: true
    ipam:
      config:
        - subnet: ${SANDBOX_NET_BASE:-10.250}.3.0/24

volumes:
  egress-log:
  postgres-data:
  forgejo-data:
  pgadmin-data:
  mailpit-data:
  opencode-data:
